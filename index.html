<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrafficVision • Caltrans Live</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            width: 100%;
            background: #0b0e14;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e8edf5;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background: #141a24;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 1px solid #2a3340;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 1000;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 1.1rem;
            white-space: nowrap;
        }
        .brand span {
            color: #5fc3ff;
        }
        .badge {
            background: #1f2a37;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.65rem;
            color: #8fa3bf;
            border: 1px solid #2f3d4f;
        }

        .search-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1 1 280px;
            max-width: 420px;
        }
        .search-wrap input {
            flex: 1;
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid #2a3340;
            background: #0b0e14;
            color: #e8edf5;
            font-size: 0.85rem;
            outline: none;
            min-width: 100px;
        }
        .search-wrap input:focus {
            border-color: #5fc3ff;
            box-shadow: 0 0 0 2px rgba(95, 195, 255, 0.15);
        }
        .search-wrap input::placeholder {
            color: #5f738f;
        }
        .search-wrap button {
            background: #1f2a37;
            border: none;
            color: #e8edf5;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            border: 1px solid #2a3340;
            white-space: nowrap;
        }
        .search-wrap button:hover {
            background: #2f3d4f;
        }
        .stats {
            font-size: 0.75rem;
            color: #8fa3bf;
            white-space: nowrap;
        }

        #map {
            flex: 1;
            width: 100%;
            min-height: 0;
            background: #0b0e14;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0b0e14;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: #8fa3bf;
            font-size: 0.9rem;
            transition: opacity 0.6s ease;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #1f2a37;
            border-top-color: #5fc3ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .leaflet-control-zoom a {
            background: #141a24 !important;
            color: #e8edf5 !important;
            border-color: #2a3340 !important;
        }
        .leaflet-control-zoom a:hover {
            background: #1f2a37 !important;
        }
        .leaflet-popup-content-wrapper {
            background: #141a24 !important;
            color: #e8edf5 !important;
            border-radius: 10px !important;
            border: 1px solid #2a3340;
        }
        .leaflet-popup-tip {
            background: #141a24 !important;
        }
        .leaflet-popup-content {
            font-size: 0.8rem;
            line-height: 1.5;
            min-width: 140px;
        }
        .leaflet-popup-content strong {
            color: #5fc3ff;
        }
        .leaflet-popup-content a {
            color: #5fc3ff;
            text-decoration: none;
        }
        .leaflet-popup-content a:hover {
            text-decoration: underline;
        }

        @media (max-width: 650px) {
            .topbar {
                flex-direction: column;
                align-items: stretch;
                padding: 10px 14px;
            }
            .search-wrap {
                max-width: 100%;
            }
            .stats {
                text-align: right;
            }
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <span>Loading live cameras from Caltrans…</span>
    </div>

    <header class="topbar">
        <div class="brand">
            <span>🚦</span> Traffic<span>Vision</span>
            <span class="badge">live</span>
        </div>
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Search road, city, or ID…" />
            <button id="searchBtn">Search</button>
        </div>
        <div class="stats" id="cameraCount">Loading…</div>
    </header>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script>
        (function() {

            if (typeof L === 'undefined') {
                document.getElementById('loading').innerHTML = `
                            <div style="color:#ff6b6b;font-size:1.4rem;margin-bottom:12px;">⚠️</div>
                            <span style="color:#ff6b6b;">Leaflet failed to load.</span>
                            <span style="font-size:0.75rem;color:#5f738f;margin-top:8px;">Check your internet connection.</span>
                        `;
                return;
            }

            // ─── CONFIG ──────────────────────────────
            // District 8 covers San Bernardino, Riverside, etc.
            // You can change this to any district 1-12
            const DISTRICT = 8;
            const API_URL =
                `https://cwwp2.dot.ca.gov/data/d${DISTRICT}/cctv/cctvStatusD${String(DISTRICT).padStart(2, '0')}.json`;

            // ─── MAP ──────────────────────────────────
            const map = L.map('map', {
                center: [34.0, -117.5],
                zoom: 9,
                zoomControl: true,
            });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; CartoDB',
                subdomains: 'abcd',
                maxZoom: 19,
            }).addTo(map);

            // ─── STATE ─────────────────────────────────
            let allMarkers = [];
            let markerData = [];

            // ─── LOAD DATA ─────────────────────────────
            fetch(API_URL)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(json => {
                    const cameras = json.data || [];

                    if (!cameras.length) {
                        throw new Error('No camera data found');
                    }

                    // Parse and add markers
                    cameras.forEach(item => {
                        const cam = item.cctv;
                        if (!cam || !cam.location) return;

                        const loc = cam.location;
                        const lat = parseFloat(loc.latitude);
                        const lng = parseFloat(loc.longitude);
                        if (isNaN(lat) || isNaN(lng)) return;

                        const name = loc.locationName || 'Unknown';
                        const road = loc.route || '';
                        const nearby = loc.nearbyPlace || '';
                        const id = cam.index || '';

                        // Build popup with image link
                        let popupContent = `<strong>${name}</strong><br />`;
                        if (road) popupContent += `Road: ${road}<br />`;
                        if (nearby) popupContent += `Near: ${nearby}<br />`;
                        if (id) popupContent += `ID: ${id}<br />`;

                        // Add image link if available
                        const imgUrl = cam.imageData?.static?.currentImageURL;
                        if (imgUrl) {
                            popupContent +=
                                `<a href="${imgUrl}" target="_blank">📸 View Image</a><br />`;
                        }

                        // Add streaming link if available
                        const streamUrl = cam.imageData?.streamingVideoURL;
                        if (streamUrl) {
                            popupContent +=
                                `<a href="${streamUrl}" target="_blank">🎥 Live Stream</a><br />`;
                        }

                        popupContent += `<span style="color:#5fc3ff;font-size:0.7rem;">● live</span>`;

                        const marker = L.circleMarker([lat, lng], {
                            radius: 6,
                            fillColor: '#5fc3ff',
                            color: '#1f2a37',
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.85,
                        })
                            .addTo(map)
                            .bindPopup(popupContent);

                        allMarkers.push(marker);
                        markerData.push({
                            marker,
                            name: name.toLowerCase(),
                            road: road.toLowerCase(),
                            nearby: nearby.toLowerCase(),
                            id: id.toLowerCase(),
                            lat,
                            lng,
                        });
                    });

                    // Update counter
                    document.getElementById('cameraCount').textContent =
                        `${markerData.length} cameras (District ${DISTRICT})`;

                    // Hide loading
                    document.getElementById('loading').classList.add('hidden');
                    map.invalidateSize();

                    console.log(`🚦 Loaded ${markerData.length} cameras from District ${DISTRICT}`);

                    // ─── SEARCH ──────────────────────────
                    function performSearch(query) {
                        const q = query.trim().toLowerCase();
                        if (!q) {
                            map.setView([34.0, -117.5], 9);
                            return;
                        }

                        const results = markerData.filter(d =>
                            d.name.includes(q) ||
                            d.road.includes(q) ||
                            d.nearby.includes(q) ||
                            d.id.includes(q)
                        );

                        if (results.length === 0) {
                            alert(`No cameras found for "${query}"`);
                            return;
                        }

                        // Center on first result
                        const first = results[0];
                        map.setView([first.lat, first.lng], 12);
                        first.marker.openPopup();
                    }

                    document.getElementById('searchBtn').addEventListener('click', () =>
                        performSearch(document.getElementById('searchInput').value)
                    );
                    document.getElementById('searchInput').addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') performSearch(e.target.value);
                    });

                })
                .catch(err => {
                    console.error('Failed to load camera data:', err);
                    document.getElementById('loading').innerHTML = `
                                <div style="color:#ff6b6b;font-size:1.4rem;margin-bottom:12px;">⚠️</div>
                                <span style="color:#ff6b6b;">Failed to load camera data.</span>
                                <span style="font-size:0.75rem;color:#5f738f;margin-top:8px;">${err.message}</span>
                                <span style="font-size:0.75rem;color:#5f738f;margin-top:4px;">Try changing the DISTRICT variable (1-12).</span>
                            `;
                });

            // ─── RESIZE SAFETY ────────────────────────
            setTimeout(() => map.invalidateSize(), 800);

        })();
    </script>

</body>
</html>
