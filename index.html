<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrafficVision Live</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            width: 100%;
            background: #0a0e14;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e8edf5;
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background: #0a0e14;
        }

        .topbar {
            background: #10161e;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f2a37;
            flex-shrink: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 8px;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }
        .logo span {
            color: #5fc3ff;
        }
        .logo .badge {
            font-size: 0.55rem;
            background: #1f2a37;
            padding: 2px 10px;
            border-radius: 40px;
            color: #8fa3bf;
            border: 1px solid #2f3d4f;
            font-weight: 400;
            margin-left: 6px;
        }

        .topbar-stats {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 0.75rem;
            color: #8fa3bf;
        }
        .topbar-stats strong {
            color: #e8edf5;
            font-weight: 600;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #2f3d4f;
            color: #8fa3bf;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .btn-outline:hover {
            border-color: #5fc3ff;
            color: #e8edf5;
        }

        .btn-primary {
            background: #5fc3ff;
            border: none;
            color: #0a0e14;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .btn-primary:hover {
            background: #7acfff;
        }

        .main {
            display: flex;
            flex: 1;
            min-height: 0;
            position: relative;
        }

        .sidebar {
            width: 340px;
            min-width: 280px;
            background: #10161e;
            border-right: 1px solid #1f2a37;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 50;
            overflow: hidden;
        }

        .sidebar-search {
            padding: 12px 16px;
            border-bottom: 1px solid #1f2a37;
            flex-shrink: 0;
        }
        .sidebar-search input {
            width: 100%;
            padding: 8px 14px;
            border-radius: 40px;
            border: 1px solid #1f2a37;
            background: #0a0e14;
            color: #e8edf5;
            font-size: 0.8rem;
            outline: none;
            transition: 0.2s;
        }
        .sidebar-search input:focus {
            border-color: #5fc3ff;
        }
        .sidebar-search input::placeholder {
            color: #5f738f;
        }

        .sidebar-categories {
            padding: 8px 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 1px solid #1f2a37;
            flex-shrink: 0;
        }
        .sidebar-categories span {
            font-size: 0.65rem;
            color: #5f738f;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 40px;
            border: 1px solid #1f2a37;
            cursor: pointer;
            transition: 0.2s;
        }
        .sidebar-categories span:hover,
        .sidebar-categories span.active {
            border-color: #5fc3ff;
            color: #e8edf5;
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }
        .sidebar-list::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-list::-webkit-scrollbar-track {
            background: #0a0e14;
        }
        .sidebar-list::-webkit-scrollbar-thumb {
            background: #1f2a37;
            border-radius: 4px;
        }

        .camera-item {
            padding: 10px 16px;
            border-bottom: 1px solid #141c26;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .camera-item:hover {
            background: #141c26;
        }
        .camera-item.active {
            background: #1a2430;
            border-left: 3px solid #5fc3ff;
        }
        .camera-item .name {
            font-size: 0.85rem;
            font-weight: 500;
            color: #e8edf5;
        }
        .camera-item .road {
            font-size: 0.7rem;
            color: #8fa3bf;
        }
        .camera-item .location {
            font-size: 0.65rem;
            color: #5f738f;
        }
        .camera-item .status {
            font-size: 0.6rem;
            color: #4ade80;
            margin-top: 2px;
        }

        .map-container {
            flex: 1;
            position: relative;
            background: #0a0e14;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #0a0e14;
        }

        .preview-overlay {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 480px;
            max-width: 55vw;
            background: #10161e;
            border: 1px solid #1f2a37;
            border-radius: 12px;
            padding: 16px;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 0;
            transform: translateY(12px);
            pointer-events: none;
        }
        .preview-overlay.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .preview-overlay .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .preview-overlay .preview-header .title {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .preview-overlay .preview-header .close {
            background: none;
            border: none;
            color: #5f738f;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 4px;
        }
        .preview-overlay .preview-header .close:hover {
            color: #e8edf5;
        }
        .preview-overlay .preview-image {
            width: 100%;
            aspect-ratio: 16/9;
            background: #0a0e14;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #1f2a37;
            min-height: 120px;
            position: relative;
        }
        .preview-overlay .preview-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-overlay .preview-image .placeholder {
            color: #5f738f;
            font-size: 0.8rem;
            text-align: center;
            padding: 20px;
        }
        .preview-overlay .preview-image .live-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #ff4444;
            color: white;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 40px;
            letter-spacing: 0.5px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .preview-overlay .preview-details {
            margin-top: 8px;
            font-size: 0.75rem;
            color: #8fa3bf;
            display: flex;
            justify-content: space-between;
        }
        .preview-overlay .preview-details .road {
            color: #5fc3ff;
        }
        .preview-overlay .preview-timestamp {
            font-size: 0.6rem;
            color: #5f738f;
            margin-top: 4px;
            text-align: right;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0e14;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: #8fa3bf;
            font-size: 0.9rem;
            transition: opacity 0.6s ease;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #1f2a37;
            border-top-color: #5fc3ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .leaflet-control-zoom a {
            background: #10161e !important;
            color: #e8edf5 !important;
            border-color: #1f2a37 !important;
        }
        .leaflet-control-zoom a:hover {
            background: #1a2430 !important;
        }
        .leaflet-popup-content-wrapper {
            background: #10161e !important;
            color: #e8edf5 !important;
            border-radius: 10px !important;
            border: 1px solid #1f2a37;
        }
        .leaflet-popup-tip {
            background: #10161e !important;
        }
        .leaflet-popup-content {
            font-size: 0.8rem;
            line-height: 1.5;
        }
        .leaflet-popup-content strong {
            color: #5fc3ff;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                min-width: unset;
                max-height: 40vh;
                border-right: none;
                border-bottom: 1px solid #1f2a37;
            }
            .main {
                flex-direction: column;
            }
            .preview-overlay {
                width: calc(100% - 32px);
                max-width: 100%;
                right: 16px;
                bottom: 16px;
            }
            .topbar-stats {
                font-size: 0.6rem;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <span>Loading cameras from Caltrans API…</span>
    </div>

    <div class="app">

        <header class="topbar">
            <div class="topbar-left">
                <div class="logo">
                    🚦 Traffic<span>Vision</span>
                    <span class="badge">LIVE</span>
                </div>
                <div class="topbar-stats">
                    <span><strong id="camCount">0</strong> cameras</span>
                    <span><strong id="carCount">0</strong> cars</span>
                </div>
            </div>
            <div class="topbar-right">
                <button class="btn-outline">🎯 THEATER MODE</button>
                <button class="btn-outline">⭐ COLLECTIONS</button>
                <button class="btn-primary">🚫 KILL THE ADS</button>
            </div>
        </header>

        <div class="main">

            <aside class="sidebar">
                <div class="sidebar-search">
                    <input type="text" id="searchInput" placeholder="Search cameras, roads, cities…" />
                </div>
                <div class="sidebar-categories">
                    <span class="active">All</span>
                    <span>California</span>
                    <span>Collections</span>
                    <span>Orange</span>
                </div>
                <div class="sidebar-list" id="cameraList"></div>
            </aside>

            <div class="map-container">
                <div id="map"></div>

                <div class="preview-overlay" id="previewOverlay">
                    <div class="preview-header">
                        <span class="title" id="previewTitle">Camera Name</span>
                        <button class="close" id="previewClose">✕</button>
                    </div>
                    <div class="preview-image" id="previewImage">
                        <div class="placeholder">📸 No live image</div>
                    </div>
                    <div class="preview-details">
                        <span class="road" id="previewRoad">Road</span>
                        <span id="previewLocation">City, County</span>
                    </div>
                    <div class="preview-timestamp" id="previewTimestamp">Updated just now</div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script>
        (function() {

            if (typeof L === 'undefined') {
                document.getElementById('loading').innerHTML = `
                            <div style="color:#ff6b6b;font-size:1.4rem;">⚠️</div>
                            <span style="color:#ff6b6b;">Leaflet failed to load.</span>
                        `;
                return;
            }

            // ─── CONFIG ──────────────────────────────────
            // Using District 8 (San Bernardino/Riverside) as it's more reliable.
            // Change this to 12 for Orange County if needed.
            const DISTRICT = 8;
            const API_URL =
                `https://cwwp2.dot.ca.gov/data/d${DISTRICT}/cctv/cctvStatusD${String(DISTRICT).padStart(2, '0')}.json`;

            // ─── DOM REFS ──────────────────────────────────
            const cameraListEl = document.getElementById('cameraList');
            const searchInput = document.getElementById('searchInput');
            const camCountEl = document.getElementById('camCount');
            const carCountEl = document.getElementById('carCount');
            const previewOverlay = document.getElementById('previewOverlay');
            const previewTitle = document.getElementById('previewTitle');
            const previewRoad = document.getElementById('previewRoad');
            const previewLocation = document.getElementById('previewLocation');
            const previewImage = document.getElementById('previewImage');
            const previewTimestamp = document.getElementById('previewTimestamp');
            const previewClose = document.getElementById('previewClose');

            // ─── STATE ──────────────────────────────────
            let allCameras = [];
            let filteredCameras = [];
            let selectedCamera = null;
            let markers = [];
            let markerMap = {};
            let refreshInterval = null;

            // ─── MAP ────────────────────────────────────
            const map = L.map('map', {
                center: [33.75, -117.90],
                zoom: 10,
                zoomControl: true,
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap',
                subdomains: 'abc',
                maxZoom: 19,
            }).addTo(map);

            // ─── FETCH DATA ──────────────────────────────
            fetch(API_URL)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    const cameras = data.data || [];
                    if (!cameras.length) throw new Error('No camera data found.');

                    // Parse the data
                    allCameras = cameras
                        .map(item => {
                            const cam = item.cctv;
                            if (!cam || !cam.location) return null;
                            const loc = cam.location;
                            const lat = parseFloat(loc.latitude);
                            const lng = parseFloat(loc.longitude);
                            if (isNaN(lat) || isNaN(lng)) return null;

                            return {
                                id: cam.index || '',
                                name: loc.locationName || 'Unknown',
                                road: loc.route || '',
                                city: loc.nearbyPlace || '',
                                county: 'California',
                                lat: lat,
                                lng: lng,
                                imageUrl: cam.imageData?.static?.currentImageURL || '',
                                cars: Math.floor(Math.random() * 80) + 10, // Placeholder
                            };
                        })
                        .filter(c => c !== null);

                    if (!allCameras.length) throw new Error('No valid cameras found.');

                    filteredCameras = [...allCameras];

                    // Update stats
                    camCountEl.textContent = allCameras.length;
                    const totalCars = allCameras.reduce((sum, c) => sum + c.cars, 0);
                    carCountEl.textContent = totalCars.toLocaleString();

                    // Render
                    renderList(filteredCameras);
                    addMarkers(allCameras);

                    // Hide loading
                    document.getElementById('loading').classList.add('hidden');
                    map.invalidateSize();

                    console.log(`✅ Loaded ${allCameras.length} cameras from District ${DISTRICT}`);
                })
                .catch(err => {
                    console.error('Failed to load:', err);
                    document.getElementById('loading').innerHTML = `
                                <div style="color:#ff6b6b;font-size:1.4rem;">⚠️</div>
                                <span style="color:#ff6b6b;">Failed to load cameras.</span>
                                <span style="font-size:0.75rem;color:#5f738f;margin-top:8px;">${err.message}</span>
                                <span style="font-size:0.75rem;color:#5f738f;margin-top:4px;">Using sample data…</span>
                            `;
                    loadSampleData();
                });

            // ─── RENDER LIST ────────────────────────────
            function renderList(cameras) {
                if (!cameras || !cameras.length) {
                    cameraListEl.innerHTML =
                        `<div style="padding:20px;color:#5f738f;text-align:center;">No cameras found</div>`;
                    return;
                }

                let html = '';
                cameras.forEach(cam => {
                    const active = selectedCamera && selectedCamera.id === cam.id ? 'active' : '';
                    html += `
                                <div class="camera-item ${active}" data-id="${cam.id}">
                                    <div class="name">${cam.name}</div>
                                    <div class="road">${cam.road} · ${cam.city || 'CA'}</div>
                                    <div class="location">${cam.county}</div>
                                    <div class="status">● live · ${cam.cars} cars</div>
                                </div>
                            `;
                });

                cameraListEl.innerHTML = html;

                cameraListEl.querySelectorAll('.camera-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const id = el.dataset.id;
                        const cam = allCameras.find(c => c.id === id);
                        if (cam) selectCamera(cam);
                    });
                });
            }

            // ─── ADD MARKERS ────────────────────────────
            function addMarkers(cameras) {
                markers.forEach(m => map.removeLayer(m));
                markers = [];
                markerMap = {};

                cameras.forEach(cam => {
                    const marker = L.circleMarker([cam.lat, cam.lng], {
                        radius: 6,
                        fillColor: '#5fc3ff',
                        color: '#1f2a37',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.85,
                    })
                        .addTo(map)
                        .bindPopup(`
                                    <strong>${cam.name}</strong><br />
                                    ${cam.road}<br />
                                    ${cam.city || 'California'}<br />
                                    <span style="color:#5fc3ff;">● live</span>
                                `);

                    marker.on('click', () => selectCamera(cam));

                    markers.push(marker);
                    markerMap[cam.id] = marker;
                });
            }

            // ─── SELECT CAMERA ──────────────────────────
            function selectCamera(cam) {
                selectedCamera = cam;
                renderList(filteredCameras);

                map.setView([cam.lat, cam.lng], 14);
                if (markerMap[cam.id]) markerMap[cam.id].openPopup();

                showPreview(cam);
            }

            // ─── SHOW PREVIEW ───────────────────────────
            function showPreview(cam) {
                previewTitle.textContent = cam.name;
                previewRoad.textContent = cam.road || 'Unknown Road';
                previewLocation.textContent = cam.city || 'California';

                // Use the image URL from the API
                const imgUrl = cam.imageUrl || '';
                const timestamp = Date.now();

                if (imgUrl) {
                    previewImage.innerHTML = `
                                <img src="${imgUrl}?t=${timestamp}" 
                                     alt="${cam.name}" 
                                     loading="lazy"
                                     style="width:100%;height:100%;object-fit:cover;"
                                     onerror="this.parentElement.innerHTML='<div class=\\"placeholder\\">📸 No live image available<br/><span style=\\"font-size:0.6rem;color:#5f738f;\\">Camera may be offline</span></div>'" />
                                <div class="live-badge">● LIVE</div>
                            `;
                } else {
                    previewImage.innerHTML =
                        `<div class="placeholder">📸 No live image available<br/><span style="font-size:0.6rem;color:#5f738f;">No feed URL provided</span></div>`;
                }

                previewTimestamp.textContent = `Updated ${new Date().toLocaleTimeString()}`;
                previewOverlay.classList.add('visible');

                // Auto-refresh
                if (refreshInterval) clearInterval(refreshInterval);
                refreshInterval = setInterval(() => {
                    if (selectedCamera && selectedCamera.id === cam.id && imgUrl) {
                        const newTimestamp = Date.now();
                        const imgEl = previewImage.querySelector('img');
                        if (imgEl) {
                            imgEl.src = `${imgUrl}?t=${newTimestamp}`;
                            previewTimestamp.textContent = `Updated ${new Date().toLocaleTimeString()}`;
                        }
                    } else {
                        clearInterval(refreshInterval);
                    }
                }, 10000);
            }

            // ─── PREVIEW CLOSE ──────────────────────────
            previewClose.addEventListener('click', () => {
                previewOverlay.classList.remove('visible');
                if (refreshInterval) {
                    clearInterval(refreshInterval);
                    refreshInterval = null;
                }
                selectedCamera = null;
                renderList(filteredCameras);
            });

            // ─── SEARCH ──────────────────────────────────
            searchInput.addEventListener('input', () => {
                const q = searchInput.value.trim().toLowerCase();
                if (!q) {
                    filteredCameras = [...allCameras];
                } else {
                    filteredCameras = allCameras.filter(c =>
                        c.name.toLowerCase().includes(q) ||
                        c.road.toLowerCase().includes(q) ||
                        c.city.toLowerCase().includes(q) ||
                        c.county.toLowerCase().includes(q) ||
                        c.id.includes(q)
                    );
                }
                renderList(filteredCameras);

                // Update markers
                markers.forEach(m => map.removeLayer(m));
                markers = [];
                markerMap = {};
                addMarkers(filteredCameras);
            });

            // ─── SAMPLE DATA FALLBACK ───────────────────
            function loadSampleData() {
                const sample = [
                    { id: 'SA-01', name: 'I-5 @ 17th St', lat: 33.7485, lng: -117.8689, road: 'I-5', city: 'Santa Ana',
                        county: 'Orange', imageUrl: '', cars: 42 },
                    { id: 'OR-01', name: 'SR-57 @ Chapman Ave', lat: 33.7873, lng: -117.8531, road: 'SR-57', city: 'Orange',
                        county: 'Orange', imageUrl: '', cars: 28 },
                    { id: 'AN-01', name: 'I-5 @ Disneyland Dr', lat: 33.8090, lng: -117.9190, road: 'I-5', city: 'Anaheim',
                        county: 'Orange', imageUrl: '', cars: 65 },
                    { id: 'IR-01', name: 'I-405 @ Jamboree Rd', lat: 33.6680, lng: -117.8550, road: 'I-405', city: 'Irvine',
                        county: 'Orange', imageUrl: '', cars: 33 },
                ];

                allCameras = sample;
                filteredCameras = [...allCameras];
                camCountEl.textContent = allCameras.length;
                const totalCars = allCameras.reduce((sum, c) => sum + c.cars, 0);
                carCountEl.textContent = totalCars.toLocaleString();

                renderList(filteredCameras);
                addMarkers(allCameras);

                document.getElementById('loading').classList.add('hidden');
                map.invalidateSize();
                console.log('📡 Using sample data (fallback)');
            }

            // ─── RESIZE SAFETY ──────────────────────────
            setTimeout(() => map.invalidateSize(), 800);
            window.addEventListener('resize', () => map.invalidateSize());

        })();
    </script>

</body>
</html>
