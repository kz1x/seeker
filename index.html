<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrafficVision • Live Cameras</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            width: 100%;
            background: #0b0e14;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e8edf5;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background: #141a24;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 1px solid #2a3340;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 1000;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 1.1rem;
            white-space: nowrap;
        }
        .brand span {
            color: #5fc3ff;
        }
        .badge {
            background: #1f2a37;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.65rem;
            color: #8fa3bf;
            border: 1px solid #2f3d4f;
        }

        .search-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1 1 280px;
            max-width: 420px;
        }
        .search-wrap input {
            flex: 1;
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid #2a3340;
            background: #0b0e14;
            color: #e8edf5;
            font-size: 0.85rem;
            outline: none;
            min-width: 100px;
        }
        .search-wrap input:focus {
            border-color: #5fc3ff;
            box-shadow: 0 0 0 2px rgba(95, 195, 255, 0.15);
        }
        .search-wrap input::placeholder {
            color: #5f738f;
        }
        .search-wrap button {
            background: #1f2a37;
            border: none;
            color: #e8edf5;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            border: 1px solid #2a3340;
            white-space: nowrap;
        }
        .search-wrap button:hover {
            background: #2f3d4f;
        }
        .stats {
            font-size: 0.75rem;
            color: #8fa3bf;
            white-space: nowrap;
        }

        #map {
            flex: 1;
            width: 100%;
            min-height: 0;
            background: #0b0e14;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0b0e14;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: #8fa3bf;
            font-size: 0.9rem;
            transition: opacity 0.6s ease;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #1f2a37;
            border-top-color: #5fc3ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .leaflet-control-zoom a {
            background: #141a24 !important;
            color: #e8edf5 !important;
            border-color: #2a3340 !important;
        }
        .leaflet-control-zoom a:hover {
            background: #1f2a37 !important;
        }
        .leaflet-popup-content-wrapper {
            background: #141a24 !important;
            color: #e8edf5 !important;
            border-radius: 10px !important;
            border: 1px solid #2a3340;
        }
        .leaflet-popup-tip {
            background: #141a24 !important;
        }
        .leaflet-popup-content {
            font-size: 0.8rem;
            line-height: 1.5;
            min-width: 140px;
        }
        .leaflet-popup-content strong {
            color: #5fc3ff;
        }
        .leaflet-popup-content a {
            color: #5fc3ff;
            text-decoration: none;
        }
        .leaflet-popup-content a:hover {
            text-decoration: underline;
        }

        @media (max-width: 650px) {
            .topbar {
                flex-direction: column;
                align-items: stretch;
                padding: 10px 14px;
            }
            .search-wrap {
                max-width: 100%;
            }
            .stats {
                text-align: right;
            }
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <span>Loading live cameras from OpenTrafficCamMap…</span>
    </div>

    <header class="topbar">
        <div class="brand">
            <span>🚦</span> Traffic<span>Vision</span>
            <span class="badge">live</span>
        </div>
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Search road, city, or ID…" />
            <button id="searchBtn">Search</button>
        </div>
        <div class="stats" id="cameraCount">Loading…</div>
    </header>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <script>
        (function() {

            if (typeof L === 'undefined') {
                document.getElementById('loading').innerHTML = `
                            <div style="color:#ff6b6b;font-size:1.4rem;margin-bottom:12px;">⚠️</div>
                            <span style="color:#ff6b6b;">Leaflet failed to load.</span>
                            <span style="font-size:0.75rem;color:#5f738f;margin-top:8px;">Check your internet connection.</span>
                        `;
                return;
            }

            // ─── DATA URL ─────────────────────────────
            // This JSON contains cameras for the USA (including California)
            const DATA_URL =
                'https://raw.githubusercontent.com/AidanWelch/OpenTrafficCamMap/main/cameras/USA.json';

            // ─── MAP ──────────────────────────────────
            const map = L.map('map', {
                center: [33.75, -117.90],
                zoom: 11,
                zoomControl: true,
            });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; CartoDB',
                subdomains: 'abcd',
                maxZoom: 19,
            }).addTo(map);

            // ─── STATE ─────────────────────────────────
            let allMarkers = [];
            let markerData = [];

            // ─── LOAD DATA ─────────────────────────────
            fetch(DATA_URL)
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    // Filter for California only
                    const californiaCameras = data.filter(cam =>
                        cam.state && cam.state.toUpperCase() === 'CA'
                    );

                    if (!californiaCameras.length) {
                        throw new Error('No California cameras found');
                    }

                    // Add markers
                    californiaCameras.forEach(cam => {
                        const lat = parseFloat(cam.lat);
                        const lng = parseFloat(cam.lng);
                        if (isNaN(lat) || isNaN(lng)) return;

                        const name = cam.name || 'Unknown Camera';
                        const road = cam.road || '';
                        const city = cam.city || '';
                        const county = cam.county || '';
                        const id = cam.id || '';

                        let popupContent = `<strong>${name}</strong><br />`;
                        if (road) popupContent += `Road: ${road}<br />`;
                        if (city) popupContent += `City: ${city}<br />`;
                        if (county) popupContent += `County: ${county}<br />`;
                        if (id) popupContent += `ID: ${id}<br />`;

                        // Add image link if available
                        const imgUrl = cam.url;
                        if (imgUrl) {
                            popupContent +=
                                `<a href="${imgUrl}" target="_blank">📸 View Image</a><br />`;
                        }

                        popupContent += `<span style="color:#5fc3ff;font-size:0.7rem;">● live</span>`;

                        const marker = L.circleMarker([lat, lng], {
                            radius: 5,
                            fillColor: '#5fc3ff',
                            color: '#1f2a37',
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.85,
                        })
                            .addTo(map)
                            .bindPopup(popupContent);

                        allMarkers.push(marker);
                        markerData.push({
                            marker,
                            name: name.toLowerCase(),
                            road: road.toLowerCase(),
                            city: city.toLowerCase(),
                            county: county.toLowerCase(),
                            id: id.toLowerCase(),
                            lat,
                            lng,
                        });
                    });

                    // Update counter
                    document.getElementById('cameraCount').textContent =
                        `${markerData.length} cameras (California)`;

                    // Hide loading
                    document.getElementById('loading').classList.add('hidden');
                    map.invalidateSize();

                    console.log(`🚦 Loaded ${markerData.length} cameras from OpenTrafficCamMap`);

                    // ─── SEARCH ──────────────────────────
                    function performSearch(query) {
                        const q = query.trim().toLowerCase();
                        if (!q) {
                            map.setView([33.75, -117.90], 11);
                            return;
                        }

                        const results = markerData.filter(d =>
                            d.name.includes(q) ||
                            d.road.includes(q) ||
                            d.city.includes(q) ||
                            d.county.includes(q) ||
                            d.id.includes(q)
                        );

                        if (results.length === 0) {
                            alert(`No cameras found for "${query}"`);
                            return;
                        }

                        // Center on first result
                        const first = results[0];
                        map.setView([first.lat, first.lng], 13);
                        first.marker.openPopup();
                    }

                    document.getElementById('searchBtn').addEventListener('click', () =>
                        performSearch(document.getElementById('searchInput').value)
                    );
                    document.getElementById('searchInput').addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') performSearch(e.target.value);
                    });

                })
                .catch(err => {
                    console.error('Failed to load camera data:', err);
                    document.getElementById('loading').innerHTML = `
                                <div style="color:#ff6b6b;font-size:1.4rem;margin-bottom:12px;">⚠️</div>
                                <span style="color:#ff6b6b;">Failed to load camera data.</span>
                                <span style="font-size:0.75rem;color:#5f738f;margin-top:8px;">${err.message}</span>
                                <span style="font-size:0.75rem;color:#5f738f;margin-top:4px;">Using sample data instead…</span>
                            `;

                    // ─── FALLBACK: SAMPLE DATA ────────────
                    loadSampleData();
                });

            // ─── FALLBACK FUNCTION ─────────────────────
            function loadSampleData() {
                const sampleCameras = [
                    { name: 'I-5 @ 17th St', lat: 33.7485, lng: -117.8689, road: 'I-5', city: 'Santa Ana', county: 'Orange' },
                    { name: 'SR-57 @ Chapman Ave', lat: 33.7873, lng: -117.8531, road: 'SR-57', city: 'Orange',
                    county: 'Orange' },
                    { name: 'I-5 @ Disneyland Dr', lat: 33.8090, lng: -117.9190, road: 'I-5', city: 'Anaheim',
                    county: 'Orange' },
                    { name: 'I-405 @ Jamboree Rd', lat: 33.6680, lng: -117.8550, road: 'I-405', city: 'Irvine',
                    county: 'Orange' },
                    { name: 'SR-1 @ Beach Blvd', lat: 33.6600, lng: -117.9990, road: 'SR-1', city: 'Huntington Beach',
                        county: 'Orange' },
                    { name: 'SR-91 @ State College Blvd', lat: 33.8700, lng: -117.8910, road: 'SR-91', city: 'Fullerton',
                        county: 'Orange' },
                    { name: 'SR-22 @ Euclid St', lat: 33.7750, lng: -117.9450, road: 'SR-22', city: 'Garden Grove',
                        county: 'Orange' },
                    { name: 'I-405 @ Harbor Blvd', lat: 33.6640, lng: -117.9140, road: 'I-405', city: 'Costa Mesa',
                        county: 'Orange' },
                    { name: 'SR-1 @ Newport Blvd', lat: 33.6270, lng: -117.9310, road: 'SR-1', city: 'Newport Beach',
                        county: 'Orange' },
                    { name: 'I-5 @ Oso Pkwy', lat: 33.5870, lng: -117.6680, road: 'I-5', city: 'Mission Viejo',
                        county: 'Orange' },
                    { name: 'SR-91 @ Harbor Blvd', lat: 33.8345, lng: -117.9145, road: 'SR-91', city: 'Anaheim',
                        county: 'Orange' },
                    { name: 'I-5 @ Katella Ave', lat: 33.8030, lng: -117.8880, road: 'I-5', city: 'Anaheim',
                    county: 'Orange' },
                    { name: 'SR-133 @ Irvine Blvd', lat: 33.6870, lng: -117.8270, road: 'SR-133', city: 'Irvine',
                        county: 'Orange' },
                    { name: 'I-405 @ Goldenwest St', lat: 33.7100, lng: -118.0150, road: 'I-405', city: 'Huntington Beach',
                        county: 'Orange' },
                    { name: 'SR-22 @ Main St', lat: 33.7498, lng: -117.8665, road: 'SR-22', city: 'Santa Ana',
                        county: 'Orange' },
                ];

                sampleCameras.forEach(cam => {
                    const popupContent = `
                                <strong>${cam.name}</strong><br />
                                Road: ${cam.road}<br />
                                City: ${cam.city}<br />
                                County: ${cam.county}<br />
                                <span style="color:#5fc3ff;font-size:0.7rem;">● sample data</span>
                            `;

                    const marker = L.circleMarker([cam.lat, cam.lng], {
                        radius: 6,
                        fillColor: '#ff6b6b',
                        color: '#1f2a37',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.85,
                    })
                        .addTo(map)
                        .bindPopup(popupContent);

                    allMarkers.push(marker);
                    markerData.push({
                        marker,
                        name: cam.name.toLowerCase(),
                        road: cam.road.toLowerCase(),
                        city: cam.city.toLowerCase(),
                        county: cam.county.toLowerCase(),
                        id: '',
                        lat: cam.lat,
                        lng: cam.lng,
                    });
                });

                document.getElementById('cameraCount').textContent =
                    `${markerData.length} cameras (sample data)`;
                document.getElementById('loading').classList.add('hidden');
                map.invalidateSize();
                console.log(`🚦 Loaded ${markerData.length} sample cameras (fallback)`);

                // ─── SEARCH (fallback) ──────────────────
                function performSearch(query) {
                    const q = query.trim().toLowerCase();
                    if (!q) {
                        map.setView([33.75, -117.90], 11);
                        return;
                    }

                    const results = markerData.filter(d =>
                        d.name.includes(q) ||
                        d.road.includes(q) ||
                        d.city.includes(q) ||
                        d.county.includes(q)
                    );

                    if (results.length === 0) {
                        alert(`No cameras found for "${query}"`);
                        return;
                    }

                    const first = results[0];
                    map.setView([first.lat, first.lng], 13);
                    first.marker.openPopup();
                }

                document.getElementById('searchBtn').addEventListener('click', () =>
                    performSearch(document.getElementById('searchInput').value)
                );
                document.getElementById('searchInput').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') performSearch(e.target.value);
                });
            }

            // ─── RESIZE SAFETY ────────────────────────
            setTimeout(() => map.invalidateSize(), 800);

        })();
    </script>

</body>
</html>
